packages:
  - widget
  - render

# simple-graph-query is a build-time input, not a runtime one: the root package
# depends on it so `SpytialLean.Sgq` can include_str docs/sgq-language.json from
# a stable path. spytial-core embeds its own prebuilt sgq bundle, so nothing
# here changes what the widget evaluates.
#
# TEMPORARY: no published sgq carries the manifest yet, so the package resolves
# to the commit that added it (simple-graph-query#68). Once a release ships it:
# delete this override, raise package.json's range to that release, add it to
# minimumReleaseAgeExclude below, and run `pnpm install`.
#
# TEMPORARY likewise for spytial-core: `introduces`, `inertWhenBare`, and
# `middleColumns` exist only on spytial-core#580/#581, and this branch derives
# from them, so the override points at a built checkout of the two merged. Drop
# it when a release carries them, and the widget's `~5.4.0` pin takes over.
overrides:
  spytial-lean>simple-graph-query: github:sidprasad/simple-graph-query#43e0f5340ec8c5fb426fe8b2ff3baf142056b1f5
  spytial-core: file:/home/ironmoon/workspace/spytial/core-manifest

# Pinned to stay consistent with the infoview bundle.
catalog:
  '@rollup/plugin-commonjs': ^28.0.1
  '@rollup/plugin-node-resolve': ^15.0.2
  '@rollup/plugin-replace': ^6.0.1
  react: ^18.2.0
  react-dom: ^18.2.0
  rollup: ^4.17.2

  # No caret: Playwright rejects browsers that don't match the npm package.
  # Bump with the image tag in render/Dockerfile.
  '@playwright/test': 1.62.0

minimumReleaseAgeExclude:
  - spytial-core@5.4.0
  - simple-graph-query@3.1.0
