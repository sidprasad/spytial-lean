packages:
  - widget
  - render

# simple-graph-query is a build-time input, not a runtime one: the root package
# depends on it so `SpytialLean.Sgq` can include_str docs/sgq-language.json from
# a stable path. spytial-core embeds its own prebuilt sgq bundle, so nothing
# here changes what the widget evaluates.
#
# TEMPORARY: the manifest only exists on an unreleased branch, so the override
# points at a local checkout. Drop it once a published sgq carries the file, and
# the `^3.1.0` pin in package.json takes over.
overrides:
  simple-graph-query: file:/home/ironmoon/workspace/spytial/simple-graph-query

# Pinned to stay consistent with the infoview bundle.
catalog:
  '@rollup/plugin-commonjs': ^28.0.1
  '@rollup/plugin-node-resolve': ^15.0.2
  '@rollup/plugin-replace': ^6.0.1
  react: ^18.2.0
  react-dom: ^18.2.0
  rollup: ^4.17.2

  # No caret: Playwright rejects browsers that don't match the npm package.
  # Bump with the image tag in render/Dockerfile.
  '@playwright/test': 1.62.0

minimumReleaseAgeExclude:
  - spytial-core@5.4.0
  - simple-graph-query@3.1.0
